[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-discord"
version = "0.2.1"
description = "High-performance Discord selfbot library for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Cascade Contributors"}
]
keywords = ["discord", "api", "selfbot", "async", "websocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
]

dependencies = [
    "aiohttp>=3.9.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
voice = [
    "PyNaCl>=1.5.0",
    "opuslib>=3.0.1",
]
security = [
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/4f2b/cascade"
Documentation = "https://cascade-discord.readthedocs.io"
Repository = "https://github.com/4f2b/cascade"
Issues = "https://github.com/4f2b/cascade/issues"
Changelog = "https://github.com/4f2b/cascade/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["cascade*"]
exclude = ["cascade.examples*"]
